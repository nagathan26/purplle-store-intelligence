version: "3.9"

services:
  api:
    build: .
    image: store-intel-api:latest
    container_name: store-intel-api

    ports:
      - "8000:8000"

    environment:
      DB_PATH: /data/store.db
      POS_PATH: "/srv/CCTV Footage/pos.csv"
      STALE_FEED_S: "600"

    volumes:
      - store_data:/data

    restart: unless-stopped

volumes:
  store_data: